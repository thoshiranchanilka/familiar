# Builds the Apple Silicon app and .dmg when a version tag (v1.2.3) is pushed,
# and attaches them to a draft GitHub Release for you to review and publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx vitest run

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Familiar ${{ github.ref_name }}"
          releaseBody: "Download the .dmg below. First launch: see Install in the README."
          releaseDraft: true
          args: --bundles app,dmg
