<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Familiar Settings</title>
    <link rel="stylesheet" href="/src/settings/settings.css" />
    <script type="module" src="/src/settings/settings.ts" defer></script>
  </head>
  <body>
    <header class="hero">
      <canvas id="hero-mascot" aria-hidden="true"></canvas>
      <div>
        <h1>Familiar</h1>
        <p class="muted">A desk buddy for Claude Code. It pops up while you work.</p>
      </div>
    </header>

    <main>
      <section>
        <h2>Mascot</h2>
        <div class="cards" id="mascots" role="radiogroup" aria-label="Mascot"></div>
      </section>

      <section>
        <h2>Size</h2>
        <div class="row">
          <input id="size" type="range" min="64" max="192" step="4" aria-label="Mascot size" />
          <output id="size-value" class="pill"></output>
        </div>
      </section>

      <section>
        <h2>Position</h2>
        <div class="corners" id="corners" role="radiogroup" aria-label="Corner"></div>
        <button id="advanced-toggle" type="button" class="quiet" aria-expanded="false" aria-controls="advanced">Advanced…</button>
        <div id="advanced" class="advanced" hidden>
          <p class="muted small">Tip: you can also drag the mascot itself anywhere on screen. It remembers the spot.</p>
          <label class="slider"><span id="offset-x-label">From the side</span>
            <input id="offset-x" type="range" min="0" max="0" step="1" /><output id="offset-x-value"></output></label>
          <label class="slider"><span id="offset-y-label">From the edge</span>
            <input id="offset-y" type="range" min="0" max="0" step="1" /><output id="offset-y-value"></output></label>
          <button id="offset-reset" type="button" class="quiet">Reset to corner</button>
        </div>
      </section>

      <section>
        <h2>Animation</h2>
        <div class="segmented" id="animation" role="radiogroup" aria-label="Animation"></div>
        <p class="muted small" id="animation-hint">Gentle animates only while Claude is busy, so it barely uses power.</p>
        <p class="note small" id="animation-note"></p>
      </section>

      <section>
        <h2>Connections</h2>
        <div class="conn">
          <div>
            <b>Claude Code</b>
            <span class="pill" id="code-status"></span>
          </div>
          <button id="code-toggle" type="button"></button>
        </div>
        <label class="check"><input id="open-at-login" type="checkbox" /> Open at login</label>
        <p class="error small" id="error" role="alert"></p>
      </section>
    </main>

    <footer>
      <span class="muted small" id="version"></span>
      <button id="quit" type="button" class="quiet">Quit Familiar</button>
    </footer>
  </body>
</html>
